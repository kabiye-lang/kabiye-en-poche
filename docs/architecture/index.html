<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabiyè en Poche architecture</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1b18;--muted:#6b665d;--line:#d9d4c9;--edge:#9a937f;
--mobile:#e8f0ff;--mobile-b:#5b7fd6;--admin:#fff1e0;--admin-b:#d08a2e;--supabase:#e6f6ee;--supabase-b:#3c9b6a;
--website:#f3e9ff;--website-b:#8a5cd0;--ci:#eceae4;--ci-b:#7c776b;--outside:#fdeaea;--outside-b:#c45656;
--high:#c0392b;--medium:#d68910;--low:#7f8c8d;--hl:#ffdd57}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--panel:#212226;--ink:#eceae6;--muted:#a19c92;--line:#3a3b40;--edge:#76716a;
--mobile:#1e2a44;--admin:#3a2b18;--supabase:#173326;--website:#2c2142;--ci:#2a2a2a;--outside:#3c1f1f;--hl:#8a6d00}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:15px;margin:0}
header .meta{color:var(--muted);font-size:12px}
header button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
#viewport{position:fixed;inset:0;top:0;touch-action:none;cursor:grab}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.area{position:absolute;border:1.5px dashed var(--line);border-radius:14px}
.area>h2{position:absolute;top:10px;left:16px;margin:0;font-size:16px;color:var(--muted)}
.box{position:absolute;width:230px;height:92px;border-radius:10px;border:2px solid;padding:8px 10px;cursor:pointer;overflow:hidden;background:var(--panel)}
.box b{display:block;font-size:13.5px}
.box .d{font-size:11px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.box .fr{position:absolute;right:6px;top:6px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;color:#fff}
.box.sel,.step.sel{outline:4px solid var(--hl)}
.box.dim{opacity:.25}
svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg#edges line{stroke:var(--edge);stroke-width:1.5}
svg#edges line.hot{stroke:var(--hl);stroke-width:3}
svg#edges text{fill:var(--muted);font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.flowtitle{position:absolute;width:230px;font-weight:700;font-size:15px;cursor:pointer}
.flowtitle small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.step{position:absolute;width:200px;height:104px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);padding:6px 8px;cursor:pointer;overflow:hidden;border-left-width:6px}
.step .n{font-size:11px;font-weight:700;color:var(--muted)}
.step .t{font-size:11.5px}
.step code{display:block;font-size:10px;color:var(--muted);margin-top:3px;word-break:break-all}
.arrow{position:absolute;color:var(--muted);font-size:16px}
.far .box .d,.far .step .t,.far .step code,.far svg#edges text{display:none}
.far .step{height:104px}
#panel{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:6;overflow:auto;padding:16px 18px 40px;transform:translateX(100%);transition:transform .2s}
#panel.open{transform:none}
#panel h3{margin:0 30px 4px 0}
#panel h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
#panel .close{position:absolute;right:12px;top:10px;font-size:20px;border:0;background:none;color:var(--ink);cursor:pointer}
#panel ol,#panel ul{padding-left:20px;margin:4px 0}
#panel li{margin:4px 0}
#panel li.cur{background:var(--hl);border-radius:4px}
#panel code{font-size:11.5px;word-break:break-all;color:var(--muted)}
.sev{font-size:10px;font-weight:700;color:#fff;padding:1px 6px;border-radius:8px;margin-right:4px}
.sev.high{background:var(--high)}.sev.medium{background:var(--medium)}.sev.low{background:var(--low)}
#untraced{display:none}
@media (max-width:640px){header{padding:6px 16px}header .meta{width:100%}#panel{top:40%;width:100vw;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}#panel.open{transform:none}}
</style>
</head>

  <span class="meta" id="meta"></span>

</header>

  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:S}}});
vp.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);moved=true;zoomAt(pinch.s*d/pinch.d/S,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(start&&pts.size===1){const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(!moved&&Math.hypot(dx,dy)>4){moved=true;if(!start.captured){vp.setPointerCapture(e.pointerId);start.captured=true}vp.classList.add('dragging')}
    if(moved){TX=start.tx+dx;TY=start.ty+dy;apply()}}});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0){start=null;vp.classList.remove('dragging');setTimeout(()=>{moved=false},0)}}
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key==='Escape'){panel.classList.remove('open');clearSel()}});
fit();
</script>
</body>
</html>
