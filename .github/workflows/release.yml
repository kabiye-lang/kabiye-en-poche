name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
      workspace:
        description: "Which package(s) to version-bump?"
        type: choice
        options:
          - all
          - app
          - website
        required: true
        default: all
      skip_version_bump:
        description: "Skip version bump? (just merge develop → main)"
        type: boolean
        default: false

jobs:
  release:
    name: Release a new version to main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # GH_PAT needs write access to main. GITHUB_TOKEN cannot push to
          # protected branches, so create a PAT and add it as a repo secret.
          token: ${{ secrets.ASSIG_UPGRADE_DEPS_P_ACCESS_TOKEN }}

      - name: Initialize git config
        run: |
          git config user.name "GitHub actions"
          git config user.email noreply@github.com

      - name: Merge develop into main
        run: |
          git fetch origin
          git checkout main
          git merge origin/develop --no-ff -m "chore: merge develop into main for release"

      - name: Bump version — App (root)
        id: next-version-app
        if: ${{ github.event.inputs.skip_version_bump != 'true' && (github.event.inputs.workspace == 'all' || github.event.inputs.workspace == 'app') }}
        run: |
          npm --no-git-tag-version version ${{ github.event.inputs.release_type }}
          echo "version=$(grep '"version":' package.json | cut -d\" -f4)" >> $GITHUB_OUTPUT

      - name: Bump version — Website
        id: next-version-website
        if: ${{ github.event.inputs.skip_version_bump != 'true' && (github.event.inputs.workspace == 'all' || github.event.inputs.workspace == 'website') }}
        run: |
          npm --prefix website --no-git-tag-version version ${{ github.event.inputs.release_type }}
          echo "version=$(grep '"version":' website/package.json | cut -d\" -f4)" >> $GITHUB_OUTPUT

      - name: Commit version bump
        if: ${{ github.event.inputs.skip_version_bump != 'true' }}
        run: |
          git add .
          git commit -m "chore: release App ${{ steps.next-version-app.outputs.version || '-' }} / Website ${{ steps.next-version-website.outputs.version || '-' }}" --no-verify

      - name: Push to main
        run: git push --no-verify
